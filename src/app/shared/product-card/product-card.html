<div
  class="bg-white rounded-3xl p-5 border border-brand-rose/30 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between group"
>
  <div>
    <!-- Foto real del producto -->
    <div class="relative aspect-[16/10] rounded-2xl overflow-hidden mb-4 bg-brand-cream">
      <img
        [src]="product().image"
        [alt]="product().name"
        loading="lazy"
        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
      />

      <div class="absolute top-3 left-3 flex flex-wrap gap-1.5">
        <span
          class="bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] uppercase font-semibold tracking-wider text-brand-charcoal shadow-sm"
        >
          {{ product().tag }}
        </span>
        @if (product().tier === 'premium') {
          <span
            class="bg-brand-charcoal/85 backdrop-blur px-2.5 py-1 rounded-full text-[10px] uppercase font-semibold tracking-wider text-brand-gold shadow-sm flex items-center gap-1"
          >
            <app-icon name="sparkles" class="w-3 h-3" />
            Premium
          </span>
        }
      </div>

      <button
        (click)="quickView()"
        class="absolute bottom-3 right-3 bg-white/90 hover:bg-brand-gold hover:text-white text-brand-charcoal p-2 rounded-full shadow-sm transition-all opacity-100 sm:opacity-0 sm:group-hover:opacity-100"
        aria-label="Ver detalle"
      >
        <app-icon name="eye" class="w-4 h-4" />
      </button>
    </div>

    <!-- Info -->
    <div class="space-y-2">
      <div class="flex items-start justify-between gap-3">
        <h3 class="font-serif text-xl font-semibold text-brand-charcoal leading-tight">
          {{ product().name }}
        </h3>
        <span class="font-serif text-lg font-bold text-brand-gold whitespace-nowrap"
          >${{ product().price.toFixed(2) }}</span
        >
      </div>
      <p class="text-xs text-brand-charcoal/60 line-clamp-2 font-light">{{ product().description }}</p>
    </div>

    <!-- Color Selector -->
    <div class="mt-4 pt-3 border-t border-brand-blush flex items-center justify-between gap-3">
      <span class="text-[11px] text-brand-charcoal/50 uppercase tracking-wider">
        Color: {{ currentColor()?.name }}
      </span>
      <div class="flex space-x-1.5">
        @for (c of product().colors; track c.name; let idx = $index) {
          <button
            (click)="changeColor(idx)"
            class="w-5 h-5 rounded-full border border-black/10 transition-transform hover:scale-105"
            [class.ring-2]="isSelected(c.name)"
            [class.ring-brand-gold]="isSelected(c.name)"
            [class.scale-110]="isSelected(c.name)"
            [style.background-color]="c.hex"
            [title]="c.name"
            [attr.aria-label]="c.name"
          ></button>
        }
      </div>
    </div>
  </div>

  <!-- Add to cart CTA -->
  <button
    (click)="addToCart()"
    class="mt-5 w-full py-3 bg-brand-blush border border-brand-rose/60 text-brand-charcoal rounded-2xl text-xs uppercase tracking-widest font-medium hover:bg-brand-charcoal hover:text-white transition-all flex items-center justify-center space-x-2"
  >
    <app-icon name="shopping-bag" class="w-3.5 h-3.5" />
    <span>Agregar al Carrito</span>
  </button>
</div>
