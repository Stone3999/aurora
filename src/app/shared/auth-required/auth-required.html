<!-- Modal: se requiere sesión para comprar -->
@if (cart.isAuthModalOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-charcoal/50 backdrop-blur-sm"
    (click)="close()"
  >
    <div
      class="bg-white rounded-3xl max-w-md w-full p-8 sm:p-10 relative shadow-2xl border border-brand-rose/30 text-center"
      (click)="$event.stopPropagation()"
    >
      <button
        (click)="close()"
        class="absolute top-4 right-4 text-brand-charcoal/60 hover:text-brand-charcoal"
        aria-label="Cerrar"
      >
        <app-icon name="x" class="w-6 h-6" />
      </button>

      <div
        class="w-16 h-16 rounded-full bg-brand-blush border border-brand-rose/50 flex items-center justify-center mx-auto mb-5"
      >
        <app-icon name="lock" class="w-7 h-7 text-brand-gold" />
      </div>

      <h3 class="font-serif text-2xl font-bold text-brand-charcoal">Inicia sesión para comprar</h3>
      <p class="text-xs text-brand-charcoal/70 leading-relaxed mt-3">
        Puedes explorar toda la colección sin cuenta. Para agregar productos a tu carrito, guardar tu
        pedido y recibir envíos discretos, crea tu cuenta LANË.
      </p>

      <div class="mt-7 space-y-3">
        <button
          (click)="goToRegister()"
          class="w-full py-3.5 bg-brand-charcoal text-white rounded-full text-xs uppercase tracking-widest font-medium hover:bg-brand-gold transition-colors shadow-md"
        >
          Crear mi cuenta
        </button>
        <button
          (click)="goToLogin()"
          class="w-full py-3.5 bg-white border border-brand-charcoal/20 text-brand-charcoal rounded-full text-xs uppercase tracking-widest font-medium hover:bg-brand-rose/40 transition-colors"
        >
          Ya tengo cuenta
        </button>
        <button
          (click)="close()"
          class="w-full py-2 text-[11px] uppercase tracking-widest text-brand-charcoal/50 hover:text-brand-gold"
        >
          Seguir explorando
        </button>
      </div>
    </div>
  </div>
}
